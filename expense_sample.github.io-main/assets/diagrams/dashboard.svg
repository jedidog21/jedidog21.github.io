<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 400" width="792" height="400" role="img">
  <style>
    svg {
      --surface: #ffffff; --sunken: #f0f2f6; --text: #1c2330; --muted: #5b6577;
      --border: #dfe3ea; --border-strong: #b9c1ce; --accent: #2f6fed; --accent-soft: #e8f0fe;
      --danger: #c93434; --danger-soft: #fdecec; --success: #1c7c45; --success-soft: #e4f4ea;
      --sans: Arial, Helvetica, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #1d2128; --sunken: #0f1216; --text: #e7eaf0; --muted: #98a2b3;
        --border: #313742; --border-strong: #4a5261; --accent: #6f9cf7; --accent-soft: #1c2a47;
        --danger: #f07070; --danger-soft: #3a1f22; --success: #5ec48a; --success-soft: #17301f;
      }
    }
    .canvas { fill: var(--surface); }
    text { fill: var(--text); font-family: var(--sans); font-size: 13px; }
    .t-title { font-weight: 650; }
    .t-sub { fill: var(--muted); font-size: 12px; }
    .t-mono { font-family: var(--mono); font-size: 12px; }
    .t-key { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--accent); }
    .t-bad { fill: var(--danger); font-weight: 700; font-family: var(--mono); }
    .t-good { fill: var(--success); font-weight: 700; font-family: var(--mono); }
    .t-get { fill: var(--accent); font-weight: 700; }
    .box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
    .box-fill { fill: var(--sunken); stroke: var(--border); stroke-width: 1; }
    .box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .box-bad { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.2; }
    .box-good { fill: var(--success-soft); stroke: var(--success); stroke-width: 1.5; }
    .group { fill: none; stroke: var(--border-strong); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
    .rule { stroke: var(--border); stroke-width: 1; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--muted); }
    .bg { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
  </style>
  <rect class="canvas" x="-16" y="-16" width="792" height="400"/>
  <title>Sketch of the dashboard and the API calls behind each card</title>
  <desc>A header with the title Expense Tracker and a Log out button, then four cards. Add expense and Add category sit side by side, with Monthly total inside the Add category card. Expenses and Spending by category each span the full width.</desc>

  <rect class="box-fill" x="0" y="0" width="760" height="368" rx="10"/>
  <text class="t-title" x="20" y="31" font-size="15">Expense Tracker</text>
  <text class="t-mono t-sub" x="660" y="31" text-anchor="end">POST /logout</text>
  <rect class="box" x="672" y="14" width="72" height="26" rx="6"/>
  <text class="t-sub" x="708" y="31" text-anchor="middle">Log out</text>

  <rect class="box" x="16" y="52" width="356" height="116" rx="8"/>
  <text class="t-title" x="32" y="78">Add expense</text>
  <text class="t-sub" x="32" y="96">category, amount, date and description</text>
  <text class="t-mono" x="32" y="124">GET /categories</text>
  <text class="t-mono" x="32" y="144">POST /expenses</text>

  <rect class="box" x="388" y="52" width="356" height="116" rx="8"/>
  <text class="t-title" x="404" y="78">Add category</text>
  <text class="t-mono" x="404" y="98">POST /categories</text>
  <text class="t-title" x="404" y="128">Monthly total</text>
  <text class="t-mono" x="404" y="148">GET /expenses/monthly-total</text>

  <rect class="box" x="16" y="184" width="728" height="96" rx="8"/>
  <text class="t-title" x="32" y="210">Expenses</text>
  <text class="t-sub" x="32" y="228">a table with a filter (all, one category, or a date range) and a Delete button on each row</text>
  <text class="t-mono" x="32" y="250">GET /expenses · GET /expenses/by-category · GET /expenses/by-date-range</text>
  <text class="t-mono" x="32" y="268">DELETE /expenses/&lt;id&gt;</text>

  <rect class="box" x="16" y="296" width="728" height="58" rx="8"/>
  <text class="t-title" x="32" y="320">Spending by category</text>
  <text class="t-mono" x="32" y="340">GET /expenses/totals-by-category</text>
</svg>
