<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 322" width="832" height="322" role="img">
  <style>
    svg {
      --surface: #ffffff; --sunken: #f0f2f6; --text: #1c2330; --muted: #5b6577;
      --border: #dfe3ea; --border-strong: #b9c1ce; --accent: #2f6fed; --accent-soft: #e8f0fe;
      --danger: #c93434; --danger-soft: #fdecec; --success: #1c7c45; --success-soft: #e4f4ea;
      --sans: Arial, Helvetica, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #1d2128; --sunken: #0f1216; --text: #e7eaf0; --muted: #98a2b3;
        --border: #313742; --border-strong: #4a5261; --accent: #6f9cf7; --accent-soft: #1c2a47;
        --danger: #f07070; --danger-soft: #3a1f22; --success: #5ec48a; --success-soft: #17301f;
      }
    }
    .canvas { fill: var(--surface); }
    text { fill: var(--text); font-family: var(--sans); font-size: 13px; }
    .t-title { font-weight: 650; }
    .t-sub { fill: var(--muted); font-size: 12px; }
    .t-mono { font-family: var(--mono); font-size: 12px; }
    .t-key { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--accent); }
    .t-bad { fill: var(--danger); font-weight: 700; font-family: var(--mono); }
    .t-good { fill: var(--success); font-weight: 700; font-family: var(--mono); }
    .t-get { fill: var(--accent); font-weight: 700; }
    .box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
    .box-fill { fill: var(--sunken); stroke: var(--border); stroke-width: 1; }
    .box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .box-bad { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.2; }
    .box-good { fill: var(--success-soft); stroke: var(--success); stroke-width: 1.5; }
    .group { fill: none; stroke: var(--border-strong); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
    .rule { stroke: var(--border); stroke-width: 1; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--muted); }
    .bg { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
  </style>
  <rect class="canvas" x="-16" y="-16" width="832" height="322"/>

    <title>How the page decides which screen to show</title>
    <desc>When the page loads it calls start(), which requests GET /categories. A 200 response shows the dashboard. A 401 response shows the login screen. A successful login calls start() again. From the dashboard, logging out or any API call that answers 401 returns to the login screen.</desc>
    <defs>
      <marker id="state-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    </defs>

    <rect class="box" x="20" y="124" width="120" height="32" rx="16"/>
    <text class="t-title" x="80" y="145" text-anchor="middle">Page loads</text>

    <rect class="box-accent" x="200" y="110" width="200" height="60" rx="8"/>
    <text class="t-title t-mono" x="300" y="136" text-anchor="middle">start()</text>
    <text class="t-mono" x="300" y="154" text-anchor="middle">GET /categories</text>

    <rect class="box" x="540" y="30" width="200" height="60" rx="8"/>
    <text class="t-title" x="640" y="56" text-anchor="middle">Dashboard</text>
    <text class="t-sub" x="640" y="74" text-anchor="middle">forms and tables</text>

    <rect class="box" x="540" y="200" width="200" height="60" rx="8"/>
    <text class="t-title" x="640" y="226" text-anchor="middle">Login screen</text>
    <text class="t-sub" x="640" y="244" text-anchor="middle">username and password</text>

    <path class="line" d="M140,140 H198" marker-end="url(#state-arrow)"/>
    <path class="line" d="M400,125 H470 V60 H538" marker-end="url(#state-arrow)"/>
    <text class="t-good" x="504" y="52" text-anchor="middle">200</text>
    <path class="line" d="M400,155 H470 V222 H538" marker-end="url(#state-arrow)"/>
    <text class="t-bad" x="504" y="214" text-anchor="middle">401</text>
    <path class="line" d="M540,246 H300 V172" marker-end="url(#state-arrow)"/>
    <text class="t-sub" x="420" y="264" text-anchor="middle">login succeeds</text>
    <path class="line" d="M640,90 V198" marker-end="url(#state-arrow)"/>
    <text class="t-sub" x="652" y="140">Log out, or any</text>
    <text class="t-sub" x="652" y="157">call answers 401</text>
</svg>
