<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 264" width="792" height="264" role="img">
  <style>
    svg {
      --surface: #ffffff; --sunken: #f0f2f6; --text: #1c2330; --muted: #5b6577;
      --border: #dfe3ea; --border-strong: #b9c1ce; --accent: #2f6fed; --accent-soft: #e8f0fe;
      --danger: #c93434; --danger-soft: #fdecec; --success: #1c7c45; --success-soft: #e4f4ea;
      --sans: Arial, Helvetica, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #1d2128; --sunken: #0f1216; --text: #e7eaf0; --muted: #98a2b3;
        --border: #313742; --border-strong: #4a5261; --accent: #6f9cf7; --accent-soft: #1c2a47;
        --danger: #f07070; --danger-soft: #3a1f22; --success: #5ec48a; --success-soft: #17301f;
      }
    }
    .canvas { fill: var(--surface); }
    text { fill: var(--text); font-family: var(--sans); font-size: 13px; }
    .t-title { font-weight: 650; }
    .t-sub { fill: var(--muted); font-size: 12px; }
    .t-mono { font-family: var(--mono); font-size: 12px; }
    .t-key { font-family: var(--mono); font-size: 11px; font-weight: 700; fill: var(--accent); }
    .t-bad { fill: var(--danger); font-weight: 700; font-family: var(--mono); }
    .t-good { fill: var(--success); font-weight: 700; font-family: var(--mono); }
    .t-get { fill: var(--accent); font-weight: 700; }
    .box { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.5; }
    .box-fill { fill: var(--sunken); stroke: var(--border); stroke-width: 1; }
    .box-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
    .box-bad { fill: var(--danger-soft); stroke: var(--danger); stroke-width: 1.2; }
    .box-good { fill: var(--success-soft); stroke: var(--success); stroke-width: 1.5; }
    .group { fill: none; stroke: var(--border-strong); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .line { fill: none; stroke: var(--muted); stroke-width: 1.5; }
    .rule { stroke: var(--border); stroke-width: 1; }
    .dashed { stroke-dasharray: 5 4; }
    .head { fill: var(--muted); }
    .bg { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; }
  </style>
  <rect class="canvas" x="-16" y="-16" width="792" height="264"/>

    <title>Entity relationship diagram</title>
    <desc>The categories table has columns id (primary key) and name (unique). The expenses table has columns id (primary key), category_id (foreign key to categories.id), amount, description and date. One category has zero or more expenses; each expense belongs to exactly one category.</desc>

    <!-- categories -->
    <rect class="box" x="40" y="60" width="250" height="94" rx="8"/>
    <path class="box-accent" d="M40,94 V68 a8,8 0 0 1 8,-8 H282 a8,8 0 0 1 8,8 V94 Z"/>
    <text class="t-title t-mono" x="165" y="82" text-anchor="middle">categories</text>
    <line class="rule" x1="40" y1="124" x2="290" y2="124"/>
    <text class="t-key" x="54" y="113">PK</text>
    <text class="t-mono" x="84" y="113">id</text>
    <text class="t-sub t-mono" x="276" y="113" text-anchor="end">INTEGER</text>
    <text class="t-key" x="54" y="143">UK</text>
    <text class="t-mono" x="84" y="143">name</text>
    <text class="t-sub t-mono" x="276" y="143" text-anchor="end">TEXT</text>

    <!-- expenses -->
    <rect class="box" x="470" y="30" width="250" height="184" rx="8"/>
    <path class="box-accent" d="M470,64 V38 a8,8 0 0 1 8,-8 H712 a8,8 0 0 1 8,8 V64 Z"/>
    <text class="t-title t-mono" x="595" y="52" text-anchor="middle">expenses</text>
    <line class="rule" x1="470" y1="94" x2="720" y2="94"/>
    <line class="rule" x1="470" y1="124" x2="720" y2="124"/>
    <line class="rule" x1="470" y1="154" x2="720" y2="154"/>
    <line class="rule" x1="470" y1="184" x2="720" y2="184"/>
    <text class="t-key" x="484" y="83">PK</text>
    <text class="t-mono" x="514" y="83">id</text>
    <text class="t-sub t-mono" x="706" y="83" text-anchor="end">INTEGER</text>
    <text class="t-key" x="484" y="113">FK</text>
    <text class="t-mono" x="514" y="113">category_id</text>
    <text class="t-sub t-mono" x="706" y="113" text-anchor="end">INTEGER</text>
    <text class="t-mono" x="514" y="143">amount</text>
    <text class="t-sub t-mono" x="706" y="143" text-anchor="end">NUMERIC(10, 2)</text>
    <text class="t-mono" x="514" y="173">description</text>
    <text class="t-sub t-mono" x="706" y="173" text-anchor="end">TEXT</text>
    <text class="t-mono" x="514" y="203">date</text>
    <text class="t-sub t-mono" x="706" y="203" text-anchor="end">DATE</text>

    <!-- relationship: exactly one category, zero or more expenses -->
    <path class="line" d="M290,109 H470"/>
    <path class="line" d="M301,101 V117 M308,101 V117"/>
    <path class="line" d="M452,109 L470,99 M452,109 L470,119"/>
    <circle class="bg" cx="444" cy="109" r="6"/>
    <text class="t-title" x="372" y="101" text-anchor="middle">has</text>
    <text class="t-sub" x="298" y="134">exactly one</text>
    <text class="t-sub" x="462" y="134" text-anchor="end">zero or more</text>
</svg>
